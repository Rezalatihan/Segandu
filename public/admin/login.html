<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Segandu Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, var(--primary-light) 0%, transparent 50%),
        radial-gradient(circle at 90% 80%, rgba(37, 99, 235, 0.15) 0%, transparent 50%),
        var(--bg-primary);
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 40px 36px;
      box-shadow: var(--shadow-lg);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-header img {
      height: 52px;
      margin-bottom: 16px;
      border-radius: 8px;
    }

    .login-header h2 {
      font-size: 26px;
      color: var(--text-main);
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      color: var(--text-main);
      font-size: 15px;
      transition: var(--transition);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-light);
    }

    .alert-box {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .alert-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .alert-success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <div class="login-header">
      <img src="../images/logo.jpg" alt="Segandu Logo" />
      <h2>Login Admin PT Selaras Alam Segandu</h2>
      <p>Masuk untuk mengelola katalog & produk mesin</p>
    </div>

    <div class="alert-box alert-error" id="alertBox"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username Admin</label>
        <div class="input-wrapper">
          <i class="fas fa-user"></i>
          <!-- Username & Password disembunyikan (tanpa preset value) -->
          <input type="text" id="username" class="form-control" placeholder="Masukkan username admin" required />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" class="form-control" placeholder="Masukkan password" required />
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">
        <i class="fas fa-sign-in-alt"></i> Masuk ke Dashboard Segandu
      </button>
    </form>
  </div>

  <script>
    /**
     * Penanganan Form Login Admin Segandu
     */
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      alertBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success && data.token) {
          // Simpan token autentikasi Segandu ke LocalStorage
          localStorage.setItem('segandu_admin_token', data.token);
          localStorage.setItem('segandu_admin_user', data.username);
          window.location.href = '/admin/dashboard.html';
        } else {
          alertBox.innerText = data.error || 'Login gagal';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.innerText = 'Terjadi kesalahan server saat login.';
        alertBox.style.display = 'block';
      }
    });
  </script>
</body>

</html>
